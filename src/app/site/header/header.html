<header class="header">
  <input class="carousel-state" type="radio" name="hero-slide" id="slide-green" checked>
  <input class="carousel-state" type="radio" name="hero-slide" id="slide-blue">
  <input class="carousel-state" type="radio" name="hero-slide" id="slide-red">

  <div class="topbar">
    <div class="logo-space">
      <img class="site-logo" src="assets/point37-logo.png?v=3" alt="Point 37">
    </div>

    <nav class="main-nav" aria-label="Navegação principal">
      <a href="#">Drinks</a>
      <a href="#">Sales</a>
      <a href="#">Delivery</a>
    </nav>

    
    <div  aria-label="Espaço para o perfil">
      <button class="profile-space" >Carrinho</button>
    </div>
  </div>

  <label class="hero-arrow hero-arrow--left arrow-from-green" for="slide-red" role="button" tabindex="0" aria-label="Produto anterior">
    <span aria-hidden="true">&#10094;</span>
  </label>

  <label class="hero-arrow hero-arrow--right arrow-from-green" for="slide-blue" role="button" tabindex="0" aria-label="Próximo produto">
    <span aria-hidden="true">&#10095;</span>
  </label>

  <label class="hero-arrow hero-arrow--left arrow-from-blue" for="slide-green" role="button" tabindex="0" aria-label="Produto anterior">
    <span aria-hidden="true">&#10094;</span>
  </label>

  <label class="hero-arrow hero-arrow--right arrow-from-blue" for="slide-red" role="button" tabindex="0" aria-label="Próximo produto">
    <span aria-hidden="true">&#10095;</span>
  </label>

  <label class="hero-arrow hero-arrow--left arrow-from-red" for="slide-blue" role="button" tabindex="0" aria-label="Produto anterior">
    <span aria-hidden="true">&#10094;</span>
  </label>

  <label class="hero-arrow hero-arrow--right arrow-from-red" for="slide-green" role="button" tabindex="0" aria-label="Próximo produto">
    <span aria-hidden="true">&#10095;</span>
  </label>

  <h1 class="font-test font-test--tanqueray">Tanqueray</h1>
  <h1 class="font-test font-test--bombay">Bombay</h1>
  <h1 class="font-test font-test--beefeater">Beefeater</h1>

  <img
    class="header__image product-layer tanqueray-layer"
    src="assets/tanqueray-transparente.png?v=8"
    alt="Garrafa de Tanqueray"
  >

  <img
    class="header__image header__image--bombay product-layer bombay-layer"
    src="assets/bombay-transparente.png?v=4"
    alt="Garrafa de Bombay Sapphire"
  >

  <img
    class="header__image header__image--beefeater product-layer beefeater-layer"
    src="assets/beefeater-transparente.png?v=2"
    alt="Garrafa de Beefeater London"
  >
</header>
