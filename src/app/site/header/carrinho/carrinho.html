<div class="carrinho-itens">

    @for (produto of produtos; track produto.nome) {

        <div class="produto">

            <div class="produto-imagem">
                <img
                    [src]="produto.imagem"
                    [alt]="produto.nome"
                >
            </div>

            <div class="produto-info">

                <h3>{{ produto.nome }}</h3>

                <span class="produto-preco">
                    R$ {{ produto.preco }}
                </span>

                <div class="quantidade">

                    <button>−</button>

                    <span>
                        {{ produto.quantidade }}
                    </span>

                    <button>+</button>

                </div>

            </div>

            <button class="btn-remover">
                🗑
            </button>

        </div>

    }

</div>
