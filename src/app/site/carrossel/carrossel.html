
<section class="header">
  <input class="carousel-state" type="radio" name="hero-slide" id="slide-green" [checked]="slideAtivo() === 'green'" (change)="selecionarSlide('green')">
  <input class="carousel-state" type="radio" name="hero-slide" id="slide-blue" [checked]="slideAtivo() === 'blue'" (change)="selecionarSlide('blue')">
  <input class="carousel-state" type="radio" name="hero-slide" id="slide-red" [checked]="slideAtivo() === 'red'" (change)="selecionarSlide('red')">

  


  <h1 class="font-test font-test--tanqueray">Tanqueray</h1>
  <h1 class="font-test font-test--bombay">Bombay</h1>
  <h1 class="font-test font-test--beefeater">Beefeater</h1>

  <img
    class="header__image product-layer tanqueray-layer"
    src="assets/tanqueray-transparente.png?v=8"
    alt="Garrafa de Tanqueray"
  >

  <img
    class="header__image header__image--bombay product-layer bombay-layer"
    src="assets/bombay-transparente.png?v=4"
    alt="Garrafa de Bombay Sapphire"
  >

  <img
    class="header__image header__image--beefeater product-layer beefeater-layer"
    src="assets/beefeater-transparente.png?v=2"
    alt="Garrafa de Beefeater London"
  >



</section>
