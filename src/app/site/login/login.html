<app-header></app-header>

<main class="login-page">
  <form class="login-card" (ngSubmit)="entrar()">
    <p class="login-card__eyebrow">Point 37</p>
    <h1>Entre na sua conta</h1>
    

    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required placeholder="voce@email.com" [ngModel]="infoModel().email"
      (ngModelChange)="infoModel.set({
    ...infoModel(),
    email: $event
  })">

    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" required placeholder="Sua senha" [ngModel]="infoModel().senha"
      (ngModelChange)="infoModel.set({
    ...infoModel(),
    senha: $event
  })">

    <button type="submit">Entrar</button>

  </form>
</main>
