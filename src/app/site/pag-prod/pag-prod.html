<main class="conteudo">
    <section class="prod-pag">
        <p class="pag-prod-sec">Seleção premium</p>

        <h1>Destilados para bons momentos</h1>

        <p class="descricao-prod">
            Curadoria de whiskeys, gins, runs e bebidas especiais
            para celebrar, presentear ou apreciar
        </p>
     <div class="grid-prod">
        @for (item of produtos; track $index) {
        <article class="produto-card", let produto of produtos>
        <div class="card-produto-cont">
            <span class="categoria-prod">
                {{item.categoria}}
            </span>

            <h2>{{item.nome}}</h2>


            <p class="detalhes-prod">
               {{item.volume}} . {{item.teor}}
            </p>

            <div class="prod-footer">
                <strong>
                   R$ {{item.preco}}
                </strong>

                
            </div>
        </div>
    </article>}
        </div>
    </section>
</main>
